# CivicPulse — Databricks Asset Bundle
# Deploys the nightly ingestion/transform/embed job pipeline and the
# Databricks App from this repo in one `databricks bundle deploy`.
# Free Edition constraints honored: single serverless job cluster policy,
# jobs sequenced (not fanned out) to stay under the 5-concurrent-task limit.

bundle:
  name: civicpulse

variables:
  catalog:
    default: civicpulse

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://<your-workspace-host>.cloud.databricks.com

include:
  - resources/*.yml
